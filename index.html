                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 18l-6-6 6-6" />
                            </svg>
                        </div>
                    </div>
                    <div class="nav-zone nav-center" id="nav-center"></div>
                    <div class="nav-zone nav-right" id="nav-right">
                        <div class="nav-indicator">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l6-6-6-6" />
                            </svg>
                        </div>
                    </div>
                </div>
                <div id="metaForm1" class="metadata-form hidden"></div>
            </div>

            <div class="video-section" id="section-2">
                <div class="video-slot slot-a onscreen" id="slot-2-front">
                    <video class="player layer-front" id="v2-front" playsinline muted preload="auto"></video>
                </div>
                <div class="video-slot slot-b offscreen-right" id="slot-2-back">
                    <video class="player layer-back" id="v2-back" playsinline muted preload="auto"></video>
                </div>
                <div id="metaForm2" class="metadata-form hidden"></div>
            </div>

            <div class="video-section" id="section-3">
                <div class="video-slot slot-a onscreen" id="slot-3-front">
                    <video class="player layer-front" id="v3-front" playsinline muted preload="auto"></video>
                </div>
                <div class="video-slot slot-b offscreen-right" id="slot-3-back">
                    <video class="player layer-back" id="v3-back" playsinline muted preload="auto"></video>
                </div>
                <div id="metaForm3" class="metadata-form hidden"></div>
            </div>

            <div class="video-section" id="section-4">
                <div class="video-slot slot-a onscreen" id="slot-4-front">
                    <video class="player layer-front" id="v4-front" playsinline muted preload="auto"></video>
                </div>
                <div class="video-slot slot-b offscreen-right" id="slot-4-back">
                    <video class="player layer-back" id="v4-back" playsinline muted preload="auto"></video>
                </div>
                <div id="metaForm4" class="metadata-form hidden"></div>
            </div>
        </div>

        <div class="ui-wrapper">
            <div class="advanced-panel hidden" id="advancedPanel">
                <div class="p-4 text-white">Advanced Tags &amp; Filters</div>
            </div>
            <div class="toolbar" id="toolbar">
                <button class="control-btn-square" id="hideForms" title="Hide Metadata Window">
                    <span class="icon-metadata-open">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                    <span class="icon-metadata-closed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </button>
                <button class="control-btn-square" id="playPauseBtn" title="Play/Pause All Videos">
                    <span class="icon-pause" id="icon-pause">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M6 4h4v16H6zM14 4h4v16h-4z" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <span class="icon-play hidden" id="icon-play">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 3l14 9-14 9V3z" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                </button>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search tags..." class="search-input-glass">
                    <span class="search-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                </div>
                <button class="control-btn-square" id="fullScreenBtn" title="Fill Screen">
                    <span class="icon-enter">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M15 3h6v6M9 21H3v-6M21 15v6h-6M3 9V3h6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <span class="icon-exit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                </button>
                <button class="control-btn-square" id="multiScreenBtn" title="Toggle Multi-Screen">
                    <span class="icon-grid" id="icon-grid">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <rect x="3" y="3" width="7" height="7" />
                            <rect x="14" y="3" width="7" height="7" />
                            <rect x="3" y="14" width="7" height="7" />
                            <rect x="14" y="14" width="7" height="7" />
                        </svg>
                    </span>
                    <span class="icon-single" id="icon-single">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <rect x="3" y="3" width="18" height="18" rx="1" />
                        </svg>
                    </span>
                </button>
                <div class="volume-control-group" id="volumeControlGroup">
                    <button class="control-btn-square is-muted" id="muteBtn" title="Mute/Unmute All Videos">
                        <span class="icon-sound">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </span>
                        <span class="icon-muted">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linecap="round" stroke-linejoin="round" />
                                <line x1="23" y1="9" x2="17" y2="15" stroke-linecap="round" stroke-linejoin="round" />
                                <line x1="17" y1="9" x2="23" y2="15" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </span>
                    </button>
                    <div class="volume-slider-wrapper" id="volumeSliderWrapper">
                        <span class="volume-slider-hint" id="volumeSliderHint">Muted</span>
                        <div class="volume-track-container" id="volumeTrackContainer">
                            <div class="volume-track-bar" id="volumeTrackBar">
                                <div class="volume-track-fill" id="volumeTrackFill" style="height: 0%;"></div>
                                <div class="volume-track-thumb" id="volumeTrackThumb" style="bottom: 0%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="control-btn-square" id="reloadBtn" title="Reload Player">
                    <span class="icon-reload">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 12a9 9 0 1 1-3-6.7" stroke-linecap="round" stroke-linejoin="round" />
                            <polyline points="21 3 21 9 15 9" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                </button>
                <button class="control-btn-square" id="uploadVideoBtn" title="Upload Video">
                    <span class="icon-upload">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                            <path d="M12 16V4" stroke-linecap="round" />
                            <path d="m7 9 5-5 5 5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M5 20h14" stroke-linecap="round" />
                        </svg>
                    </span>
                </button>
            </div>
        </div>
        <div id="video-loader" class="video-loader-overlay">
            <div class="video-loader-spinner"></div>
            <p class="video-loader-text">Loading videos...</p>
        </div>
        <div id="no-videos-box" hidden>
            <p class="no-videos-text" id="no-videos-title">
                No videos found.
            </p>
            <div id="active-tags"></div>
            <div id="reset-section">
                <p class="reset-info">
                    You have watched all available videos.<br>
                    Reset your progress to clear cached data and watch everything again.
                </p>
                <button id="reset-btn">Reset progress &amp; watch again</button>
            </div>
        </div>
    </main>
    <noscript>
        <p>This app requires JavaScript.</p>
        <img src="/thumbnails/preview.jpg" alt="Static thumbnail of video interface" />
    </noscript>
</body>

</html>
