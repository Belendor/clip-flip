server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name clip-flip.com www.clip-flip.com 56.228.95.201 _;

    root /var/www/clipflip;
    index index.html;

    # Allow large video uploads
    client_max_body_size 500M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Frontend Single Page App / Static HTML
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Express Backend (Port 3000)
    # Automatically rewrites /api/endpoint -> http://127.0.0.1:3000/endpoint
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Video Batch 1 (Static video files: e.g. /video/1.mp4)
    location ^~ /video/ {
        root /var/www/clipflip;
        try_files $uri =404;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
    }

    # Video Batch 2 (Static video files: e.g. /video1/11256.mp4, /video1/new/...)
    location ^~ /video1/ {
        root /var/www/clipflip;
        try_files $uri =404;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
    }

    # Thumbnails
    location ^~ /thumbnails/ {
        root /var/www/clipflip;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin *;
    }

    # Direct backend route proxies (in case requests bypass /api prefix)
    location ~ ^/(videos|tags|new|auth|upload-video|confirm-segments|seo-tags|download) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Cache static built assets aggressively
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
