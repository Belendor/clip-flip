<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="50%" stop-color="#07080c"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="roseGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(225, 29, 72, 0.28)"/>
      <stop offset="100%" stop-color="rgba(225, 29, 72, 0)"/>
    </radialGradient>
    <radialGradient id="skyGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.22)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </radialGradient>
    <!-- Logo Gradients -->
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b6c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#roseGlow)"/>
  <rect width="1200" height="630" fill="url(#skyGlow)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Center Content Container -->
  <g transform="translate(600, 240)">
    <!-- Logo Icon -->
    <g transform="translate(0, -50)" filter="url(#shadow)">
      <!-- Squircle Container -->
      <rect x="-80" y="-80" width="160" height="160" rx="40" fill="#0f121a" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
      <!-- Top Flip Arrow (Rose) -->
      <path d="M -36 -4 A 42 42 0 0 1 36 -24 L 28 -14 L 56 -22 L 46 -50 L 38 -40 A 58 58 0 0 0 -48 -4 Z" fill="url(#rose)"/>
      <!-- Bottom Flip Arrow (Sky) -->
      <path d="M 36 12 A 42 42 0 0 1 -36 32 L -28 22 L -56 30 L -46 58 L -38 48 A 58 58 0 0 0 48 12 Z" fill="url(#sky)"/>
      <!-- Play Triangle -->
      <path d="M -10 -22 C -10 -25 -7 -27 -4 -25 L 26 -2 C 29 0 29 4 26 6 L -4 29 C -7 31 -10 29 -10 26 Z" fill="#ffffff"/>
    </g>

    <!-- Brand Name -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
      Clip<tspan fill="#e11d48">Flip</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
      Nonstop Video Clips · Watch Instantly
    </text>
  </g>

  <!-- Bottom Badges / Feature Pills -->
  <g transform="translate(600, 520)">
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ Zero Buffering</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="middle">🔁 Seamless Repeat</text>
    </g>
    <g transform="translate(250, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">🏷️ Watch by Tags</text>
    </g>
  </g>
</svg>
