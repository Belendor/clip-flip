<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b6c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="8"/>

  <!-- Top Curved Flip Arrow (Rose) -->
  <path d="M 140 230 A 130 130 0 0 1 366 160 L 340 190 L 424 168 L 396 86 L 372 114 A 180 180 0 0 0 100 230 Z" fill="url(#rose)" filter="url(#shadow)"/>

  <!-- Bottom Curved Flip Arrow (Sky Blue) -->
  <path d="M 372 282 A 130 130 0 0 1 146 352 L 172 322 L 88 344 L 116 426 L 140 398 A 180 180 0 0 0 412 282 Z" fill="url(#sky)" filter="url(#shadow)"/>

  <!-- Center Play Button (White with subtle curve) -->
  <path d="M 224 186 C 224 180 230 176 236 179 L 332 245 C 338 249 338 259 332 263 L 236 329 C 230 332 224 328 224 322 Z" fill="#ffffff" filter="url(#shadow)"/>
</svg>
